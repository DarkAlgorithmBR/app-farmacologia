<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="farmacoGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#farmacoGrad512)" />
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#2DD4BF" stroke-width="6" stroke-opacity="0.25" />

  <!-- Central Capsule Icon -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Capsule Left Half -->
    <path d="M -64,-140 C -106,-140 -140,-106 -140,-64 L -140,64 C -140,106 -106,140 -64,140 L 0,140 L 0,-140 Z" fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Capsule Right Half -->
    <path d="M 0,-140 L 64,-140 C 106,-140 140,-106 140,-64 L 140,64 C 140,106 106,140 64,140 L 0,140 Z" fill="#F59E0B" />
    
    <!-- Medical Cross in Left Half -->
    <g transform="translate(-70, 0)">
      <rect x="-10" y="-38" width="20" height="76" rx="8" fill="#0D9488" />
      <rect x="-38" y="-10" width="76" height="20" rx="8" fill="#0D9488" />
    </g>

    <!-- Brain / Pulse lines in Right Half -->
    <g transform="translate(68, 0)">
      <path d="M -32,0 L -16,-28 L 0,28 L 16,-16 L 32,0" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
